version: 2

models:
  - name: dim_species
    columns:
      - name: taxon_key
        tests:
          - not_null
          - unique
  
  - name: fct_occurrences
    columns:
      - name: gbif_key
        tests:
          - not_null
          - unique
      - name: taxon_key
        tests:
          - relationships:
              to: ref('dim_species') 
              field: taxon_key